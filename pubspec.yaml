publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.2
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5
